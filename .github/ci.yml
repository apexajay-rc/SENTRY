name: SENTRY Integration Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 mypy

    - name: Lint with flake8
      run: |
        # Only scan SENTRY source code, ignore virtual environments
        flake8 daemon/ core/ engine/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 daemon/ core/ engine/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Type check with mypy
      run: |
        mypy daemon/ core/ engine/ --ignore-missing-imports
