[workspace]
resolver = "2"
members = [
    "crates/sentry-core",
    "crates/sentry-linux",
    "crates/sentry-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["SENTRY contributors"]

[profile.release]
lto = true
codegen-units = 1
strip = true
